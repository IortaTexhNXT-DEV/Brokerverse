# Drop-in configuration for a real SonarQube / SonarCloud scan (sonar-scanner).
sonar.projectKey=iortatechnxt_brokerverse
sonar.projectName=BrokerVerse
sonar.sources=shared/src,server/src,web/src
sonar.tests=shared/test,server/test,web/src/test,e2e/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/migrations/**
sonar.javascript.lcov.reportPaths=shared/coverage/lcov.info,server/coverage/lcov.info,web/coverage/lcov.info
sonar.eslint.reportPaths=reports/eslint-server.json,reports/eslint-web.json
sonar.cpd.exclusions=**/*.test.ts
sonar.sourceEncoding=UTF-8
