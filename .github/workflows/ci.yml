name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/brokerverse_e2e
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/brokerverse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE brokerverse_test;'
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE brokerverse_e2e;'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Quality gate (SonarQube-style)
        run: npm run quality
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-gate
          path: reports/quality-gate.md
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: End-to-end (real browser, five personas)
        run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
